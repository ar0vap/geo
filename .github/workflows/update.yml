name: Update geo files
on:
  schedule:
    - cron: "30 3 * * *"   # каждый день в 06:30 по Москве
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download runetfreedom
        run: |
          curl -sSfL -o full-geosite.dat https://github.com/runetfreedom/russia-v2ray-rules-dat/releases/latest/download/geosite.dat
          curl -sSfL -o full-geoip.dat https://github.com/runetfreedom/russia-v2ray-rules-dat/releases/latest/download/geoip.dat
      - name: Trim
        run: |
          python3 trim.py full-geosite.dat geosite.dat category-ru,yandex,vk,mailru,ru-available-only-inside,ru-blocked,category-ads-all
          python3 trim.py full-geoip.dat geoip.dat ru,private
          rm full-geosite.dat full-geoip.dat
      - name: Commit
        run: |
          git config user.name "geo-bot"
          git config user.email "geo-bot@users.noreply.github.com"
          git add geosite.dat geoip.dat
          git diff --cached --quiet || git commit -m "update geo $(date -u +%F)"
          git push
